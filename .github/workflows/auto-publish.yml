name: Auto-publish

on:
  schedule:
    # Кожні 15 хв у вікні 5:02-18:47 UTC = 8:02-21:47 Kyiv (UTC+3).
    # ⚠️ ЧОМУ ЧАСТО І ЧОМУ ЦЕ БЕЗКОШТОВНО: репо ПУБЛІЧНЕ, а для публічних
    # репозиторіїв хвилини Actions не тарифікуються взагалі. Ліміт 2000 хв/міс
    # діє лише на приватні - саме на приватному lapka-project квота вигоріла
    # 24.07.2026 і публікації стали на 8 днів. Тут цього статись не може.
    # ⚠️ ЧОМУ НЕ РІДШЕ: при годинному тіку картка з часом 16:32 виходила о 17:17,
    # тобто на 45 хв пізніше (715, 20.09). Скрипт публікує все, де
    # «Час публікації» <= поточного, тож частіший тік лише зменшує запізнення.
    # ⚠️ GitHub schedule НЕ гарантований: під навантаженням він дропає і зсуває
    # прогони, тому реально виходить менше за 56 тіків на добу. Це і є причина
    # ставити 4 на годину замість 1 - щоб навіть половина дала розрив ~30 хв.
    - cron: '2,17,32,47 5-18 * * *'
  workflow_dispatch: # ручний запуск для тестів

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ БЕЗ actions/checkout. Це репо ~3,9 GB (усі PNG сторіз + історія),
      # і git fetch тут не вкладається навіть у 10 хв — 26.08.2026 прогони
      # вмирали з "exceeded the maximum execution time" ще до старту скрипта,
      # і sparse-checkout + filter:blob:none проблему НЕ вирішили.
      # Джобі потрібен рівно один файл, тож тягнемо його по HTTP (репо публічне).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch publisher script
        run: |
          curl -sSfL --retry 3 \
            -o auto-publish.mjs \
            "https://raw.githubusercontent.com/zoopawfect-dev/lapka-story-assets/main/tools/auto-publish.mjs"
          node --check auto-publish.mjs

      - name: Run auto-publisher
        run: node auto-publish.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
