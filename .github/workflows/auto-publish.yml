name: Auto-publish

on:
  schedule:
    # :17 кожну годину, 5:17-18:17 UTC = 8:17-21:17 Kyiv (UTC+3)
    - cron: '17 5-18 * * *'
  workflow_dispatch: # ручний запуск для тестів

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ БЕЗ actions/checkout. Це репо ~3,9 GB (усі PNG сторіз + історія),
      # і git fetch тут не вкладається навіть у 10 хв — 26.08.2026 прогони
      # вмирали з "exceeded the maximum execution time" ще до старту скрипта,
      # і sparse-checkout + filter:blob:none проблему НЕ вирішили.
      # Джобі потрібен рівно один файл, тож тягнемо його по HTTP (репо публічне).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch publisher script
        run: |
          curl -sSfL --retry 3 \
            -o auto-publish.mjs \
            "https://raw.githubusercontent.com/zoopawfect-dev/lapka-story-assets/main/tools/auto-publish.mjs"
          node --check auto-publish.mjs

      - name: Run auto-publisher
        run: node auto-publish.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
