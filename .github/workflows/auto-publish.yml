name: Auto-publish

on:
  schedule:
    # :17 кожну годину, 5:17-18:17 UTC = 8:17-21:17 Kyiv (UTC+3)
    - cron: '17 5-18 * * *'
  workflow_dispatch: # ручний запуск для тестів

jobs:
  publish:
    runs-on: ubuntu-latest
    # 26.08.2026: було 5 хв — job вбивався ще на checkout (репо ~3,9 GB PNG),
    # прогони 25.08 20:43 і 26.08 14:42 померли з "exceeded the maximum execution time".
    timeout-minutes: 10
    steps:
      # ⚠️ Тільки tools/ і без вмісту блобів: репо асетів важить ~3,9 GB,
      # повний checkout з'їдав 2-3 хв з таймауту і робив кожен тік лотереєю.
      # Скрипту потрібен рівно один файл — tools/auto-publish.mjs.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: tools

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run auto-publisher
        run: node tools/auto-publish.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
